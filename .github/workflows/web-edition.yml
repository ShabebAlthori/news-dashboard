# Publishes the web edition to GitHub Pages and keeps it up to date.
# Every run: fetch all feeds → cluster, score and (optionally) summarize → build static site → deploy.
# The news database is carried between runs with the Actions cache.
#
# Keeping a 15-minute cadence: GitHub treats `schedule` as best effort and drops many runs
# under load (in practice only a few per day ran). So each run also queues the next one with
# workflow_dispatch (see the `chain` job). The cron below is only a backstop that restarts the
# chain if it ever stops. Set the repository variable AUTO_REFRESH_CHAIN to "off" to disable it.
name: Web edition

on:
  schedule:
    # Off-peak minutes: GitHub is busiest (and drops most scheduled runs) at :00/:15/:30/:45.
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-edition
  cancel-in-progress: false

jobs:
  build:
    # Runs only once the repository is public (free GitHub Pages and unlimited Actions minutes).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore news database
        uses: actions/cache/restore@v6
        with:
          path: data
          key: news-db-${{ github.run_id }}
          restore-keys: news-db-

      - name: Build static site
        run: npm run build:static
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Refresh feeds and write data files
        run: npm run export:static
        env:
          RETENTION_DAYS: "14"
          SNAPSHOT_DAYS: "7"
          # Optional AI summaries and Arabic translation — add ONE repository secret:
          #   GEMINI_API_KEY    free tier, from https://aistudio.google.com/apikey
          #   ANTHROPIC_API_KEY paid, Claude (used first if both are set)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5-5' }}
          AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT || '200' }}
          # Data Radar: notable new data repositories via the GitHub search API (read-only use).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # How often this site is republished; shown in the page and used to flag stale data.
          PUBLISH_INTERVAL_MINUTES: "15"
          # Used to reuse already-published translations if the news database had to start empty.
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # AI budget: requests per run (each covers several stories) and per UTC day.
          AI_MAX_REQUESTS_PER_RUN: ${{ vars.AI_MAX_REQUESTS_PER_RUN || '12' }}

      - name: Save news database
        if: success() || failure()
        uses: actions/cache/save@v6
        with:
          path: data
          key: news-db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Queue the next update ~15 minutes after this run started, unless a run is already
  # waiting or running. workflow_dispatch is one of the two events GITHUB_TOKEN may trigger.
  # Runs even when the build failed, so one bad run does not stop the updates.
  chain:
    needs: deploy
    if: ${{ always() && !cancelled() && !github.event.repository.private && vars.AUTO_REFRESH_CHAIN != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait until the next update is due
        run: |
          started=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          due=$(( $(date -d "$started" +%s) + 14 * 60 ))
          wait=$(( due - $(date +%s) ))
          echo "Run started $started; next update due in ${wait}s"
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
      - name: Queue the next update
        run: |
          others=$(gh run list --workflow web-edition.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != \"completed\")] | length")
          if [ "$others" -gt 0 ]; then
            echo "Another run is already queued or running ($others); not queuing a duplicate."
          else
            gh workflow run web-edition.yml --ref "${{ github.ref_name }}"
            echo "Next update queued."
          fi

  # GitHub disables scheduled workflows in public repositories after 60 days without
  # activity. If the last commit is older than 50 days, add an empty commit (cheap check,
  # done on every scheduled or chained run because a single daily cron is often dropped).
  keepalive:
    if: ${{ !github.event.repository.private && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Keep scheduled updates active
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled news updates active"
            git push
          fi
